<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#080808">

    <title>
        Connexion — Atelier jeu d'échecs Lezay
    </title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #080808;

            color: #ffffff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;

            pointer-events: none;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,0.055),
                    transparent 38%
                );
        }

        .background::before {
            content: "";

            position: absolute;

            width: 700px;
            height: 700px;

            border: 1px solid rgba(255,255,255,0.035);

            border-radius: 50%;

            top: -420px;
            left: 50%;

            transform: translateX(-50%);
        }

        .background::after {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border: 1px solid rgba(255,255,255,0.025);

            border-radius: 50%;

            bottom: -380px;
            left: 50%;

            transform: translateX(-50%);
        }


        /* =====================================================
           LOGIN CONTAINER
        ===================================================== */

        .login-container {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 440px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .login-card {

            background: #101010;

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 16px;

            padding: 48px 44px 42px;

            box-shadow:
                0 30px 90px rgba(0,0,0,0.55);

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-container {

            text-align: center;

            margin-bottom: 34px;

        }

        .club-logo {

            width: 86px;
            height: 86px;

            object-fit: contain;

            display: block;

            margin: 0 auto 22px;

        }


        /* =====================================================
           TITLES
        ===================================================== */

        .eyebrow {

            margin-bottom: 9px;

            color: #777;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 3px;

        }

        h1 {

            margin: 0;

            color: #fff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;

            font-weight: 400;

            letter-spacing: -0.3px;

        }

        .subtitle {

            margin: 10px 0 0;

            color: #666;

            font-size: 12px;

            line-height: 1.6;

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #aaa;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.3px;

        }

        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border:

                1px solid
                rgba(255,255,255,0.12);

            border-radius: 8px;

            background: #0b0b0b;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }

        input::placeholder {

            color: #4f4f4f;

        }

        input:hover {

            border-color:
                rgba(255,255,255,0.20);

        }

        input:focus {

            background: #0e0e0e;

            border-color:
                rgba(255,255,255,0.45);

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,0.035);

        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-container {

            position: relative;

        }

        .password-container input {

            padding-right: 75px;

        }

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            padding: 6px 5px;

            border: none;

            background: transparent;

            color: #666;

            font-size: 10px;

            cursor: pointer;

            text-transform: uppercase;

            letter-spacing: 0.8px;

        }

        .show-password:hover {

            color: #fff;

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 53px;

            margin-top: 5px;

            border: 1px solid #fff;

            border-radius: 8px;

            background: #fff;

            color: #080808;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1.2px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }

        .login-button:hover {

            background: #080808;

            color: #fff;

            transform: translateY(-1px);

        }

        .login-button:active {

            transform: translateY(0);

        }

        .login-button:disabled {

            opacity: 0.45;

            cursor: not-allowed;

            transform: none;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: none;

            margin-top: 18px;

            padding: 12px 14px;

            border-radius: 7px;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;

        }

        .status.show {

            display: block;

        }

        .status.error {

            background: #151515;

            border: 1px solid #3b3b3b;

            color: #d0d0d0;

        }

        .status.success {

            background: #151515;

            border: 1px solid #555;

            color: #fff;

        }


        /* =====================================================
           BOTTOM
        ===================================================== */

        .bottom {

            text-align: center;

            margin-top: 24px;

        }

        .bottom-line {

            width: 32px;

            height: 1px;

            background: #333;

            margin: 0 auto 17px;

        }

        .bottom p {

            margin: 0;

            color: #555;

            font-size: 9px;

            line-height: 1.7;

            letter-spacing: 0.3px;

        }

        .bottom strong {

            color: #777;

            font-weight: 500;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading-screen {

            position: fixed;

            inset: 0;

            z-index: 999;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #080808;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .3s ease,
                visibility .3s ease;

        }

        .loading-screen.show {

            opacity: 1;

            visibility: visible;

        }

        .loading-inner {

            text-align: center;

        }

        .loading-logo {

            width: 55px;
            height: 55px;

            object-fit: contain;

            margin-bottom: 18px;

        }

        .loading-text {

            color: #555;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 2.5px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }

            .login-card {

                padding:
                    38px
                    24px
                    34px;

                border-radius: 13px;

            }

            .club-logo {

                width: 72px;
                height: 72px;

            }

            h1 {

                font-size: 24px;

            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="background"></div>


    <!-- =====================================================
         LOADING SCREEN
    ===================================================== -->

    <div
        class="loading-screen"
        id="loadingScreen"
    >

        <div class="loading-inner">

            <img
                class="loading-logo"
                src="https://image-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/icon-echec-lezay_orig.png"
                alt="Atelier jeu d'échecs Lezay"
            >

            <div class="loading-text">
                Ouverture de l'administration
            </div>

        </div>

    </div>


    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <main class="login-container">


        <section class="login-card">


            <!-- LOGO / TITLE -->

            <div class="logo-container">

                <img
                    class="club-logo"
                    src="https://image-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/icon-echec-lezay_orig.png"
                    alt="Atelier jeu d'échecs Lezay"
                >

                <div class="eyebrow">
                    Atelier jeu d'échecs Lezay
                </div>

                <h1>
                    Espace Administration
                </h1>

                <p class="subtitle">
                    Connectez-vous pour accéder
                    à la gestion du club.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        E-mail administrateur
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@echeclezay.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••••••"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="passwordToggle"
                        >
                            Afficher
                        </button>

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Se connecter
                </button>


            </form>


            <!-- STATUS -->

            <div
                class="status"
                id="status"
            ></div>


        </section>


        <!-- FOOTER -->

        <div class="bottom">

            <div class="bottom-line"></div>

            <p>
                <strong>
                    Atelier jeu d'échecs Lezay
                </strong>
                <br>

                Collège Lezay Marnésia — Strasbourg
                <br>

                Espace réservé à l'administration
            </p>

        </div>


    </main>


    <script>


        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            'https://mulwdqtyojndrjbpgldk.supabase.co';


        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_AdZl_u0YAK2xSiv3pX74iA_Q2GMnIwz';


        const {
            createClient
        } = supabase;


        const db = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById(
                'loginForm'
            );


        const emailInput =
            document.getElementById(
                'email'
            );


        const passwordInput =
            document.getElementById(
                'password'
            );


        const passwordToggle =
            document.getElementById(
                'passwordToggle'
            );


        const loginButton =
            document.getElementById(
                'loginButton'
            );


        const status =
            document.getElementById(
                'status'
            );


        const loadingScreen =
            document.getElementById(
                'loadingScreen'
            );


        /* =====================================================
           STATUS
        ===================================================== */

        function showStatus(
            message,
            type
        ) {

            status.textContent =
                message;

            status.className =
                'status show ' + type;

        }


        function hideStatus() {

            status.textContent = '';

            status.className =
                'status';

        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        passwordToggle.addEventListener(
            'click',
            function () {

                if (
                    passwordInput.type ===
                    'password'
                ) {

                    passwordInput.type =
                        'text';

                    passwordToggle.textContent =
                        'Masquer';

                } else {

                    passwordInput.type =
                        'password';

                    passwordToggle.textContent =
                        'Afficher';

                }

            }
        );


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            'submit',
            async function (event) {

                event.preventDefault();


                hideStatus();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (
                    !email ||
                    !password
                ) {

                    showStatus(
                        'Veuillez renseigner votre e-mail et votre mot de passe.',
                        'error'
                    );

                    return;

                }


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    'Connexion...';


                try {


                    /* -----------------------------------------
                       SUPABASE AUTH
                    ----------------------------------------- */

                    const {
                        data,
                        error
                    } =
                        await db.auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    /* -----------------------------------------
                       ERROR
                    ----------------------------------------- */

                    if (error) {

                        console.error(
                            'Supabase Auth:',
                            error
                        );

                        showStatus(
                            'E-mail ou mot de passe incorrect.',
                            'error'
                        );

                        return;

                    }


                    /* -----------------------------------------
                       USER CHECK
                    ----------------------------------------- */

                    if (
                        !data ||
                        !data.user
                    ) {

                        showStatus(
                            'Impossible de récupérer votre compte.',
                            'error'
                        );

                        return;

                    }


                    /* -----------------------------------------
                       SUCCESS
                    ----------------------------------------- */

                    showStatus(
                        'Connexion réussie.',
                        'success'
                    );


                    loadingScreen.classList.add(
                        'show'
                    );


                    /*
                     * IMPORTANT
                     *
                     * Après connexion :
                     *
                     * login.html
                     *       ↓
                     * index.html
                     *
                     * index.html vérifiera la session
                     * Supabase et affichera le dashboard.
                     */

                    setTimeout(
                        function () {

                            window.location.replace(
                                'index.html'
                            );

                        },
                        500
                    );


                } catch (error) {


                    console.error(
                        'Login error:',
                        error
                    );


                    showStatus(
                        'Une erreur est survenue. Veuillez réessayer.',
                        'error'
                    );


                } finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        'Se connecter';

                }

            }
        );


        /* =====================================================
           CHECK EXISTING SESSION
        ===================================================== */

        async function checkExistingSession() {

            try {

                const {
                    data,
                    error
                } =
                    await db.auth.getSession();


                if (
                    !error &&
                    data &&
                    data.session
                ) {

                    /*
                     * Déjà connecté.
                     *
                     * On retourne directement
                     * au dashboard.
                     */

                    window.location.replace(
                        'index.html'
                    );

                }

            } catch (error) {

                console.error(
                    'Session check:',
                    error
                );

            }

        }


        /* =====================================================
           START
        ===================================================== */

        checkExistingSession();

    </script>

</body>
</html>
